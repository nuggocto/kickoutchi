[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# release.yml stays hand-maintained so its action pins, validation, attestations,
# and scoped publication credentials are preserved across cargo-dist updates.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap that receives the generated formula after each stable release.
tap = "nuggocto/homebrew-tap"
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Linux release binaries are built in Debian 11 containers and must not acquire
# symbols newer than the declared glibc 2.31 floor.
min-glibc-version = { "aarch64-unknown-linux-gnu" = "2.31", "x86_64-unknown-linux-gnu" = "2.31" }
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[dist.github-action-commits]
"actions/checkout" = "v7.0.1"
"actions/upload-artifact" = "v7.0.2"
"actions/download-artifact" = "v8.0.2"

# The namespace capability journey hangs on the older Ubuntu 22.04 runner
# kernels. Keep archive execution native while matching the passing CI kernel.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = { runner = "ubuntu-22.04", host = "x86_64-unknown-linux-gnu", container = { image = "rust:1.98.0-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9", host = "x86_64-unknown-linux-gnu", package-manager = "apt" } }
aarch64-unknown-linux-gnu = { runner = "ubuntu-24.04-arm", host = "aarch64-unknown-linux-gnu", container = { image = "rust:1.98.0-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9", host = "aarch64-unknown-linux-gnu", package-manager = "apt" } }
