[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  # Required by fuzz/libfuzzer-sys; the main workspace check permits this one
  # allowance to be unencountered, while the fuzz workspace must encounter it.
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
