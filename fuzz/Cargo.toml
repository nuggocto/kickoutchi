[package]
name = "kickoutchi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
kickoutchi = { path = "..", version = "=1.4.5" }

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linux_proc"
path = "fuzz_targets/linux_proc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_member_path"
path = "fuzz_targets/archive_member_path.rs"
test = false
doc = false
bench = false
