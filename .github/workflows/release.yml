# Hand-maintained cargo-dist release workflow. Keep action references pinned and
# publication credentials scoped to the job or step that needs them.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  AXOUPDATER_VERSION: "0.10.3"
  DIST_VERSION: "0.34.0"
  RUST_VERSION: "1.100.0"

concurrency:
  # Releases share the Homebrew tap branch and must publish in order.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      tag-flag: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-dist
        run: cargo install --locked cargo-dist --version "$DIST_VERSION"
      - name: Cache cargo-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        name: Plan release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_ARGS: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }}
        run: |
          set -euo pipefail
          dist $PLAN_ARGS --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: Build (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Rust in release container
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup >/dev/null
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Select Rust on Unix runner
        if: ${{ !matrix.container && runner.os != 'Windows' }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Select Rust on Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed" }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed" }
      - name: Install cargo-dist on Unix
        if: runner.os != 'Windows'
        run: cargo install --locked cargo-dist --version "$DIST_VERSION"
      - name: Install cargo-dist on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo install --locked cargo-dist --version $env:DIST_VERSION
      - name: Fetch release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install build dependencies
        run: ${{ matrix.packages_install }}
      - name: Build artifacts
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: dist build $TAG_FLAG --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
      - id: cargo-dist
        name: Collect artifacts
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Rebuild Linux updater at supported ABI floor
        if: runner.os == 'Linux'
        shell: bash
        env:
          UPDATER_TARGET: ${{ join(matrix.targets, '') }}
        run: |
          set -euo pipefail
          RUST_HOST="$(rustc -vV | grep '^host: ' | cut -d' ' -f2)"
          test "$RUST_HOST" = "$UPDATER_TARGET"
          cargo install --locked axoupdater-cli --version "$AXOUPDATER_VERSION" --root target/axoupdater
          install -m 0755 target/axoupdater/bin/axoupdater "target/distrib/kickoutchi-${UPDATER_TARGET}-update"
      - name: Enable native Linux capabilities for artifact journeys
        if: runner.os == 'Linux' && !matrix.container
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Require readelf for Linux ABI validation
        if: runner.os == 'Linux'
        run: command -v readelf >/dev/null
      - name: Validate native release archive
        # Linux containers deliberately lack initial PID namespace visibility.
        # Validate their exact archives on native runners in the job below.
        if: runner.os != 'Linux'
        env:
          KICKOUTCHI_RELEASE_DISTRIB: target/distrib
          KICKOUTCHI_RELEASE_TARGETS_JSON: ${{ toJSON(matrix.targets) }}
          KICKOUTCHI_RELEASE_RUNNER_OS: ${{ runner.os }}
          KICKOUTCHI_RELEASE_RUNNER_ARCH: ${{ runner.arch }}
          KICKOUTCHI_RELEASE_CONTAINER: ${{ matrix.container && '1' || '0' }}
        run: cargo test --locked --test release_artifact_validator validate_generated_native_archive -- --exact --ignored --nocapture
      - name: Upload native artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  validate-linux-archives:
    name: Validate Linux archive (${{ matrix.target }})
    needs: build-local-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust and compile validators
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo test --locked --all-features --no-run
      - name: Enable native Linux namespace capabilities
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v readelf >/dev/null
      - name: Fetch native Linux archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib/
      - name: Validate native Linux archive
        env:
          KICKOUTCHI_RELEASE_TARGETS_JSON: ${{ format('["{0}"]', matrix.target) }}
          KICKOUTCHI_RELEASE_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            runner_user="$1"
            shift
            exec runuser -u "$runner_user" -- "$@"
          ' sh "$(id -un)" env PATH="$PATH" \
            KICKOUTCHI_RELEASE_DISTRIB=target/distrib \
            KICKOUTCHI_RELEASE_TARGETS_JSON="$KICKOUTCHI_RELEASE_TARGETS_JSON" \
            KICKOUTCHI_RELEASE_RUNNER_OS=Linux \
            KICKOUTCHI_RELEASE_RUNNER_ARCH="$KICKOUTCHI_RELEASE_RUNNER_ARCH" \
            KICKOUTCHI_RELEASE_CONTAINER=0 \
            cargo test --locked --test release_artifact_validator validate_generated_native_archive -- --exact --ignored --nocapture

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        name: Build global artifacts
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output '.upload_files[]' dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload global artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  validate-installers:
    name: Validate installer (${{ matrix.name }})
    needs: build-global-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            installer: kickoutchi-installer.sh
            targets_json: '["x86_64-unknown-linux-gnu"]'
          - name: macOS ARM64
            runner: macos-15
            installer: kickoutchi-installer.sh
            targets_json: '["aarch64-apple-darwin"]'
          - name: Windows x64
            runner: windows-2022
            installer: kickoutchi-installer.ps1
            targets_json: '["x86_64-pc-windows-msvc"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust on Unix
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Select Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed" }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed" }
      - name: Fetch release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Execute generated installer and updater
        env:
          KICKOUTCHI_RELEASE_DISTRIB: target/distrib
          KICKOUTCHI_RELEASE_INSTALLER: target/distrib/${{ matrix.installer }}
          KICKOUTCHI_RELEASE_TARGETS_JSON: ${{ matrix.targets_json }}
          KICKOUTCHI_RELEASE_RUNNER_OS: ${{ runner.os }}
          KICKOUTCHI_RELEASE_RUNNER_ARCH: ${{ runner.arch }}
        run: cargo test --locked --test release_artifact_validator validate_generated_native_installer -- --exact --ignored --nocapture

  attest-release-artifacts:
    name: Attest release artifacts
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - validate-installers
      - validate-linux-archives
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Fetch release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Stage publication assets
        run: |
          set -euo pipefail
          mkdir -p target/attestation-subjects
          subject_count=0
          for artifact in target/distrib/*; do
            test -f "$artifact" || continue
            case "$(basename "$artifact")" in
              *-dist-manifest.json) continue ;;
            esac
            cp -- "$artifact" target/attestation-subjects/
            subject_count=$((subject_count + 1))
          done
          test "$subject_count" -gt 0
      - name: Generate artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/attestation-subjects/*
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in target/attestation-subjects/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - validate-installers
      - validate-linux-archives
      - attest-release-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          test "$TAG_COMMIT" = "$RELEASE_COMMIT"
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload final release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Collect GitHub release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Remove internal build manifests
        run: rm -f artifacts/*-dist-manifest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          test "$TAG_COMMIT" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: github-actions[bot]
      GITHUB_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nuggocto/homebrew-tap
      - name: Fetch generated formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: generated-formula/
          merge-multiple: true
      - name: Commit formula
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_USER"
          git config user.email "$GITHUB_EMAIL"

          while IFS= read -r release; do
            filename="$(jq -r '.artifacts[] | select(endswith(".rb"))' <<< "$release")"
            name="${filename%.rb}"
            version="$(jq -r '.app_version' <<< "$release")"
            test -f "generated-formula/${filename}"
            cp "generated-formula/${filename}" "Formula/${filename}"
            git add "Formula/${filename}"
            git diff --cached --quiet || git commit -m "${name} ${version}"
          done < <(jq -c '.releases[] | select([.artifacts[] | endswith(".rb")] | any)' <<< "$PLAN")
      - name: Push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          git push
