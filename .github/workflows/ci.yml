name: CI

on:
  push:
    branches:
      - shrek
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1
  MSRV: 1.95.0
  ARCHLINUX_IMAGE: "archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239"

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust version
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Compile all targets with MSRV
        run: cargo +"$MSRV" test --locked --all-features --no-run

      - name: Run MSRV unit tests
        run: cargo +"$MSRV" test --locked --all-features --lib

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Verify regenerated Arch metadata
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$ARCHLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              cp -a /workspace/packaging/arch /tmp/arch
              chown -R nobody:nobody /tmp/arch
              for package in kickoutchi-bin; do
                runuser -u nobody -- /bin/bash -lc \
                  "cd /tmp/arch/${package} && diff -u .SRCINFO <(makepkg --printsrcinfo)"
              done
            '

      - name: Run cargo-deny
        run: |
          cargo deny --locked check --allow license-not-encountered
          cargo deny --manifest-path fuzz/Cargo.toml --locked check

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Enable unprivileged user namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run tests
        # Preserve the runner's user and PID namespace for permission/ownership
        # assertions, but exclude unrelated runner traffic from socket snapshots.
        run: |
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            runner_user="$1"
            shift
            exec runuser -u "$runner_user" -- "$@"
          ' sh "$(id -un)" env PATH="$PATH" KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES=1 \
            cargo test --locked --all-features

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}/target/release/kickoutchi
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}/target/release/kick
          KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES: "1"
        run: |
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            runner_user="$1"
            shift
            exec runuser -u "$runner_user" -- "$@"
          ' sh "$(id -un)" env PATH="$PATH" \
            KICKOUTCHI_RELEASE_E2E_REQUIRED="$KICKOUTCHI_RELEASE_E2E_REQUIRED" \
            KICKOUTCHI_E2E_KICKOUTCHI="$KICKOUTCHI_E2E_KICKOUTCHI" \
            KICKOUTCHI_E2E_KICK="$KICKOUTCHI_E2E_KICK" \
            KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES="$KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES" \
            bash -c '
              set -euo pipefail
              cargo test --locked --all-features --test cli_contract
              cargo test --locked --all-features --test cli_contract required_release_artifact_paths_are_complete_and_versioned -- --exact --ignored
            '

  nix:
    name: Nix (${{ matrix.system }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      - name: Evaluate every declared Nix system
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: nix flake check --no-update-lock-file --all-systems

      - name: Build and verify native Nix package
        run: |
          nix build --no-update-lock-file ".#packages.${{ matrix.system }}.kickoutchi"
          PACKAGE_VERSION="$(nix eval --raw ".#packages.${{ matrix.system }}.kickoutchi.version")"
          test "$(./result/bin/kickoutchi --version)" = "kickoutchi ${PACKAGE_VERSION}"
          test "$(./result/bin/kick --version)" = "kickoutchi ${PACKAGE_VERSION}"

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy

      - name: Use pinned Rust toolchain
        shell: bash
        run: rustup default "$RUST_VERSION"

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}\target\release\kickoutchi.exe
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}\target\release\kick.exe
        run: |
          cargo test --locked --all-features --test cli_contract
          cargo test --locked --all-features --test cli_contract required_release_artifact_paths_are_complete_and_versioned -- --exact --ignored

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}/target/release/kickoutchi
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}/target/release/kick
        run: |
          cargo test --locked --all-features --test cli_contract
          cargo test --locked --all-features --test cli_contract required_release_artifact_paths_are_complete_and_versioned -- --exact --ignored

  ci-complete:
    name: CI Complete
    if: ${{ always() }}
    needs:
      - msrv
      - supply-chain
      - linux
      - nix
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          MSRV_RESULT: ${{ needs.msrv.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          NIX_RESULT: ${{ needs.nix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          for result in \
            "$MSRV_RESULT" \
            "$SUPPLY_CHAIN_RESULT" \
            "$LINUX_RESULT" \
            "$NIX_RESULT" \
            "$WINDOWS_RESULT" \
            "$MACOS_RESULT"
          do
            test "$result" = "success"
          done
