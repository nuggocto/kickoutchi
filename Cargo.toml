[package]
name = "kickoutchi"
version = "1.4.5"
edition = "2024"
rust-version = "1.95.0"
description = "A clean TUI and CLI port janitor: see which process owns each open local port and kick it out safely"
license = "MIT"
repository = "https://github.com/nuggocto/kickoutchi"
homepage = "https://kickoutchi.com"
authors = ["nugget <vincent@sshmoi.com>"]
readme = "README.md"
keywords = ["ports", "processes", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["mise.toml", "rust-toolchain.toml"]
# Two binary names are declared below; `cargo run` without --bin needs this.
default-run = "kickoutchi"

# This target only shares application bootstrap code between the two binaries.
# Kickoutchi does not expose a supported embedding API.
[lib]
doc = false

# Both names run the same program; `kick` is the short CLI alias.
[[bin]]
name = "kickoutchi"
path = "src/bin/kickoutchi.rs"

[[bin]]
name = "kick"
path = "src/bin/kick.rs"

[dependencies]
# TUI + terminal control. crossterm is kept as a direct dependency (not only via
# ratatui's re-export) because the event loop and terminal lifecycle use it.
ratatui = "0.30.2"
crossterm = "0.29.0"

# CLI parsing and serialization for the shared model, config, and CLI.
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

# Error handling and diagnostics. Typed errors keep module boundaries explicit;
# tracing logs diagnostics to stderr only, never into TUI output.
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Platform config-directory resolution (XDG on Linux), for config-file loading
# in the shared model/config/CLI foundation.
dirs = "6.0.0"

# Terminal column widths for table padding and bounded endpoint labels. Byte
# length misaligns accented and CJK text. Ratatui already depends on this crate.
unicode-width = "0.2.2"

# Exact bind diagnostics require setting reuse-address and IPv6-only behavior
# before bind. Keep the dependency exact and on its empty default feature set;
# in particular, do not enable its broad `all` API.
socket2 = "=0.6.5"

[dev-dependencies]
# Security-sensitive workflow key discovery uses a full YAML parser so quoted,
# sequence-shorthand, and flow-mapping keys cannot bypass the contract tests.
serde_yaml_ng = { version = "=0.10.0", default-features = false }

# Release-only archive verification. These stay out of the shipped binaries and
# replace the former Python validator with bounded native Rust parsers.
sha2 = { version = "=0.10.9", default-features = false }
tar = { version = "=0.4.46", default-features = false }
xz4rust = { version = "=0.2.2", default-features = false, features = ["bcj", "crc64", "delta", "no_unsafe", "sha256", "std"] }
zip = { version = "=8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
# Unix termination uses the OS signal API through the process module.
# macOS collection also uses libc's libproc/sysctl bindings directly.
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
# Windows collection uses IP Helper directly. Termination uses process handles
# to keep the confirmed process identity stable.
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints.clippy]
pedantic = "warn"
# Require a reason for each lint suppression. Prefer `expect` when the lint
# fires on every target because it warns when the suppression becomes stale.
# Use `allow` for target-specific lints to avoid false
# `unfulfilled_lint_expectations` warnings on other targets.
allow_attributes_without_reason = "warn"

[lints.rust]
# cargo-fuzz sets this cfg across the instrumented dependency graph. Declaring
# it keeps ordinary builds strict without exposing a production Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
panic = "unwind"
strip = "symbols"
